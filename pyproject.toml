[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffictwin"
version = "0.7.0"
description = "Import-first research software for TrafficTwin what-if traffic and VEC experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abdulla Al Mamun Akash" }]
dependencies = [
    "defusedxml==0.7.1",
    "httpx>=0.28.1,<1",
    "pydantic>=2",
    "plotly>=5",
    "pyarrow>=18",
    "pydeck>=0.9.1,<1",
    "pyproj>=3.6,<4",
    "pypdf>=5",
    "PyYAML>=6",
    "reportlab>=4",
    "streamlit>=1.58,<2",
    "typer>=0.12",
]

[project.optional-dependencies]
tos = [
    "numpy>=1.26",
]
vec = [
    "numpy>=1.26",
    "sumolib==1.27.0",
]
vec-runner = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "numpy>=1.26",
]
dev = [
    "build>=1",
    "numpy>=1.26",
    "playwright>=1.48",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "sumolib==1.27.0",
    "mypy>=1.10",
    "types-defusedxml==0.7.0.20260504",
    "types-PyYAML>=6",
]

[project.scripts]
traffictwin = "traffictwin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traffictwin.integration.sumo_execution" = [
    "scenario_synthetic_square/*.xml",
    "scenario_synthetic_square/*.sumocfg",
    "scenario_synthetic_square/*.md",
]
"traffictwin.integration.manchester" = ["boundary_data/*.geojson"]
"traffictwin.resources.research" = ["*.json", "*.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "cold_apptest: expensive genuine cold AppTest proof requiring fresh cache (run with --run-cold-apptest -m cold_apptest)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Exact historical packages: preserve bytes and check them with verify_research_archives.py.
# New dissertation packages and maintained documentation tools remain in Ruff scope.
extend-exclude = [
    "docs/dissertation/complete_draft_2026-09-07",
    "docs/dissertation/substantive_revision_2026-09-07",
    "docs/dissertation/gap_closure_2026-09-08",
    "docs/dissertation/production_mechanism_2026-09-08",
    "docs/dissertation/empirical_extension_2026-09-08",
    "docs/dissertation/joint_confirmation_2026-09-08",
    "docs/dissertation/followups_2026-09-15",
    "docs/evaluation/common_target_mechanism_audit_2026-09-07",
    "docs/evaluation/vec_followup_2026-09-07",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "C4", "SIM"]
ignore = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "jax",
    "numpy",
    "numpy.*",
    "plotly.*",
    "pydeck",
    "pyarrow",
    "pyarrow.*",
    "reportlab",
    "reportlab.*",
    "streamlit",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["gpu.*"]
ignore_errors = true
follow_imports = "skip"

[tool.coverage.run]
source = ["traffictwin"]
