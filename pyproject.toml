[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffictwin"
version = "0.1.0"
description = "Import-first research software for TrafficTwin what-if traffic and VEC experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abdulla Al Mamun Akash" }]
dependencies = [
    "pydantic>=2",
    "plotly>=5",
    "pyarrow>=18",
    "pypdf>=5",
    "PyYAML>=6",
    "reportlab>=4",
    "streamlit>=1.36",
    "typer>=0.12",
]

[project.optional-dependencies]
tos = [
    "numpy>=1.26",
]
vec = [
    "numpy>=1.26",
    "pyproj>=3.6,<4",
    "sumolib==1.27.0",
]
vec-runner = [
    "jax==0.4.30",
    "jaxlib==0.4.30",
    "numpy>=1.26",
]
dev = [
    "build>=1",
    "numpy>=1.26",
    "playwright>=1.48",
    "pytest>=8",
    "pytest-cov>=5",
    "pyproj>=3.6,<4",
    "ruff>=0.5",
    "sumolib==1.27.0",
    "mypy>=1.10",
    "types-PyYAML>=6",
]

[project.scripts]
traffictwin = "traffictwin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "S", "C4", "SIM"]
ignore = [
    "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "plotly.*",
    "pyarrow",
    "pyarrow.*",
    "reportlab",
    "reportlab.*",
    "streamlit",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["traffictwin"]
