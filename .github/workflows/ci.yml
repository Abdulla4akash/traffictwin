name: TrafficTwin CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install uv
          uv sync --locked --extra dev --extra vec-runner

      - name: Dependency lock consistency
        run: uv lock --check

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Tests
        run: uv run python -m pytest --cov=traffictwin --cov-report=term-missing

      - name: Generated reference consistency
        run: |
          uv run python scripts/generate_reference_docs.py
          git diff --exit-code -- docs/reference/generated

      - name: Documentation link consistency
        run: uv run python scripts/check_markdown_links.py

      - name: Standalone demo smoke
        run: |
          uv run traffictwin demo initialise .ci-demo
          uv run traffictwin synthetic verify .ci-demo
          uv run traffictwin provenance export .ci-demo/bundles/baseline --root-type metric --root-id task.completion.rate --format json --output .ci-demo/exports/ci_provenance.json
          uv run traffictwin report run .ci-demo/bundles/baseline --output .ci-demo/reports/ci_run.md
          uv run traffictwin report full .ci-demo/bundles/stressed_demand --comparison-baseline .ci-demo/bundles/baseline --output .ci-demo/reports/ci_full.html
          uv run traffictwin release stage-demo-site .ci-demo --output .ci-public

      - name: Fixture immutability check
        run: git diff --exit-code -- tests/fixtures examples

      - name: Build package
        run: uv run python -m build

      - name: Clean wheel installation smoke
        run: |
          uv venv --python ${{ matrix.python-version }} .ci-wheel
          uv pip install --python .ci-wheel/bin/python dist/traffictwin-0.7.0-py3-none-any.whl
          .ci-wheel/bin/python -c "import traffictwin; assert traffictwin.__version__ == '0.7.0'"
          .ci-wheel/bin/traffictwin synthetic presets

      - name: Build standalone Streamlit container
        if: matrix.python-version == '3.12'
        run: docker build -t traffictwin-ci .
