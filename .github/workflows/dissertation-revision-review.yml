name: Dissertation revision review

on:
  push:
    branches: [docs/dissertation-examiner-revision-2026-09-11]
    paths: [.github/workflows/dissertation-revision-review.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e01b755b8b633f43c9c7bb6fdd0d75beb6469e8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export pinned lint wheel and Crossref registration metadata
        run: |
          mkdir -p output/revision-tooling
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tomllib
          import urllib.request
          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          version = next(p['version'] for p in lock['package'] if p['name'] == 'ruff')
          subprocess.run([sys.executable, '-m', 'pip', 'download', '--no-deps', f'ruff=={version}', '--dest', 'output/revision-tooling'], check=True)
          result = {}
          for doi in ['10.1109/TITS.2024.3349546', '10.1109/TMC.2025.3572296']:
              try:
                  request = urllib.request.Request('https://api.crossref.org/works/' + doi, headers={'User-Agent': 'TrafficTwinDissertationReferenceVerification/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result[doi] = json.load(response)
              except Exception as exc:
                  result[doi] = {'error': type(exc).__name__, 'message': str(exc)}
          pathlib.Path('output/revision-tooling/reference-registration.json').write_text(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dissertation-revision-tooling
          path: output/revision-tooling/
          retention-days: 7
          if-no-files-found: error
